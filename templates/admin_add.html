<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Parcel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow p-4">

        <h2 class="text-center text-success mb-4">
            📦 Add New Parcel
        </h2>

        <form method="POST" enctype="multipart/form-data">

    <div class="mb-3">
        <label class="form-label">Tracking Number</label>
        <input type="text" class="form-control" name="tracking_number" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Sender Name</label>
        <input type="text" class="form-control" name="sender_name" required>
    </div>

    <!-- Add this here -->
    <div class="mb-3">
        <label class="form-label">Receiver Name</label>
        <input type="text" class="form-control" name="receiver_name" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Receiver Email</label>
        <input type="email" class="form-control" name="receiver_email" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-select" name="status">
            <option value="Created">Created</option>
            <option value="In Transit">In Transit</option>
            <option value="Out for Delivery">Out for Delivery</option>
            <option value="Delivered">Delivered</option>
            <option value="Pendinh">Pending</option>
            <option value="On Hold">On Hold</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Current Location</label>
        <input type="text" class="form-control" name="location" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Parcel Image</label>
        <input type="file" class="form-control" name="parcel_image" accept="image/*">
    </div>
            <button type="submit" class="btn btn-success">
                Add Parcel
            </button>

            <a href="/admin" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

</body>
</html>
