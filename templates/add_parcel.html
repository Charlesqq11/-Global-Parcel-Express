<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Parcel</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">📦 Parcel Tracking</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin">Admin Dashboard</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h3>Add New Parcel</h3>
        </div>

        <div class="card-body">

            {% if message %}
            <div class="alert alert-success">
                {{ message }}
            </div>
            {% endif %}

            <form action="/admin/add" method="POST">

                <div class="mb-3">
                    <label class="form-label">Tracking Number</label>
                    <input type="text" class="form-control" name="tracking_number" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Sender Name</label>
                    <input type="text" class="form-control" name="sender_name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Receiver Name</label>
                    <input type="text" class="form-control" name="receiver_name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <input type="text" class="form-control" name="status" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" name="location" required>
                </div>

                <button type="submit" class="btn btn-success">
                    Add Parcel
                </button>

                <a href="/admin" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
