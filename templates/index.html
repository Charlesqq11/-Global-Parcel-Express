<!DOCTYPE html>
<html lang="en">
   <head>
    <style>
        body {
            background-color: #f4f6f9;
        }
        .navbar-brand {
            font-size: 1.5rem;
        }
        .input-group input {
            border-right: none;
        }
        .input-group button {
            border-left: none;
            font-weight: 600;
        }
    </style>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Parcel Tracking</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
       <div class="container">
          <a class="navbar-brand fw-bold" href="#">📦 Parcel Tracking</a>
    </div>
    </nav>
    <div class="container mt-5 text-center">
       <h1 class="mb-4 fw-bold">Track Your Parcel</h1>
       <p class="text-muted">Enter your tracking number below to track your parcel.</p>
       <div class="row justify-content-center">
          <form action="/track" method="POST" class="row g-3'>
                <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" name="trackingNumber" id="trackingNumber" placeholder="Enter Tracking Number" required>
                      <button class="btn btn-primary btn-lg" type="submit"> Track</button>
                </div>
            </form>
        </div>
    </div>
<footer class="bg-light text-center py-3 mt-5">
       <p>&copy; 2026 Parcel Tracking. All rights reserved.</p>
</footer>
</html>
