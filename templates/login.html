<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>

        /* ============================================================
           PREMIUM ADMIN LOGIN
        ============================================================ */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(13, 110, 253, 0.16),
                    transparent 38%
                ),
                linear-gradient(
                    135deg,
                    #f8fafc 0%,
                    #eef2f7 100%
                );

            color: #172033;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 18px;
        }

        /* ============================================================
           MAIN WRAPPER
        ============================================================ */

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        /* ============================================================
           BRAND
        ============================================================ */

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-mark {
            width: 58px;
            height: 58px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background: linear-gradient(
                135deg,
                #0d6efd,
                #084298
            );

            color: white;

            font-size: 27px;

            box-shadow:
                0 12px 30px rgba(13, 110, 253, 0.25);
        }

        .brand-name {
            margin: 0;

            font-size: 25px;
            font-weight: 750;
            letter-spacing: -0.6px;

            color: #111827;
        }

        .brand-subtitle {
            margin-top: 5px;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 3px;

            color: #64748b;
        }

        /* ============================================================
           LOGIN CARD
        ============================================================ */

        .login-card {
            border: 1px solid rgba(15, 23, 42, 0.08);

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.94);

            padding: 34px;

            box-shadow:
                0 25px 60px rgba(15, 23, 42, 0.10),
                0 5px 15px rgba(15, 23, 42, 0.04);

            backdrop-filter: blur(12px);
        }

        /* ============================================================
           HEADER
        ============================================================ */

        .login-header {
            margin-bottom: 28px;
        }

        .login-header h1 {
            margin: 0;

            font-size: 26px;
            font-weight: 700;

            letter-spacing: -0.5px;

            color: #111827;
        }

        .login-header p {
            margin: 8px 0 0;

            font-size: 14px;
            line-height: 1.6;

            color: #64748b;
        }

        /* ============================================================
           LABELS
        ============================================================ */

        .form-label {
            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;

            color: #334155;
        }

        /* ============================================================
           INPUTS
        ============================================================ */

        .form-control {
            min-height: 50px;

            border: 1px solid #dbe1ea;

            border-radius: 10px;

            background: #f8fafc;

            padding: 12px 14px;

            font-size: 14px;

            color: #111827;

            box-shadow: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .form-control:hover {
            background: #ffffff;
        }

        .form-control:focus {
            background: #ffffff;

            border-color: #0d6efd;

            box-shadow:
                0 0 0 4px rgba(13, 110, 253, 0.10);
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        /* ============================================================
           PASSWORD WRAPPER
        ============================================================ */

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 75px;
        }

        /* ============================================================
           SHOW PASSWORD
        ============================================================ */

        .show-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: 0;

            background: transparent;

            color: #64748b;

            font-size: 12px;
            font-weight: 600;

            padding: 6px 5px;

            cursor: pointer;

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }

        .show-password:hover {
            color: #0d6efd;
        }

        .show-password:focus {
            outline: none;

            color: #0d6efd;
        }

        /* ============================================================
           ERROR MESSAGE
        ============================================================ */

        .alert {
            border-radius: 10px;

            border: 1px solid #fecaca;

            background: #fff1f2;

            color: #b42318;

            font-size: 13px;

            padding: 12px 14px;

            margin-bottom: 22px;
        }

        /* ============================================================
           LOGIN BUTTON
        ============================================================ */

        .login-button {
            min-height: 50px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #0d6efd,
                #0b5ed7
            );

            color: #ffffff;

            font-size: 14px;
            font-weight: 650;

            box-shadow:
                0 8px 20px rgba(13, 110, 253, 0.20);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .login-button:hover {
            background: linear-gradient(
                135deg,
                #0b5ed7,
                #084298
            );

            transform: translateY(-1px);

            box-shadow:
                0 12px 25px rgba(13, 110, 253, 0.26);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* ============================================================
           BACK BUTTON
        ============================================================ */

        .back-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 42px;

            padding: 9px 18px;

            border: 1px solid #dbe1ea;

            border-radius: 9px;

            background: #ffffff;

            color: #475569;

            font-size: 13px;
            font-weight: 600;

            text-decoration: none;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }

        .back-button:hover {
            background: #f8fafc;

            border-color: #cbd5e1;

            color: #0f172a;
        }

        /* ============================================================
           SECURITY NOTE
        ============================================================ */

        .security-note {
            margin-top: 22px;

            text-align: center;

            font-size: 11px;

            color: #94a3b8;
        }

        .security-note span {
            color: #16a34a;

            font-weight: 600;
        }

        /* ============================================================
           FOOTER
        ============================================================ */

        .footer {
            margin-top: 22px;

            text-align: center;

            font-size: 11px;

            color: #94a3b8;
        }

        /* ============================================================
           MOBILE
        ============================================================ */

        @media (max-width: 480px) {

            body {
                padding: 20px 14px;
            }

            .login-card {
                padding: 25px 20px;

                border-radius: 17px;
            }

            .login-header h1 {
                font-size: 23px;
            }

            .brand-name {
                font-size: 23px;
            }
        }

    </style>
</head>

<body>

<div class="login-wrapper">

    <!-- ============================================================
         BRAND
    ============================================================ -->

    <div class="brand">

        <div class="brand-mark">
            📦
        </div>

        <h2 class="brand-name">
            Parcel Tracking
        </h2>

        <div class="brand-subtitle">
            ADMINISTRATION
        </div>

    </div>


    <!-- ============================================================
         LOGIN CARD
    ============================================================ -->

    <div class="login-card">

        <div class="login-header">

            <h1>
                Admin Login
            </h1>

            <p>
                Sign in to securely manage your parcel tracking system.
            </p>

        </div>


        <!-- ========================================================
             ERROR MESSAGE
        ======================================================== -->

        {% if message %}

        <div class="alert">
            {{ message }}
        </div>

        {% endif %}


        <!-- ========================================================
             LOGIN FORM
        ======================================================== -->

        <form method="POST">

            <!-- USERNAME -->

            <div class="mb-4">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="username"
                    placeholder="Enter Username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        id="password"
                        placeholder="Enter Password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                        onclick="togglePassword()"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="btn login-button w-100"
            >
                Login
            </button>

        </form>


        <!-- ========================================================
             SECURITY
        ======================================================== -->

        <div class="security-note">
            <span>● Secure access</span>
            &nbsp; • &nbsp;
            Authorized administrators only
        </div>


        <!-- ========================================================
             BACK HOME
        ======================================================== -->

        <div class="text-center mt-4">

            <a
                href="/"
                class="back-button"
            >
                ← Back to Home
            </a>

        </div>

    </div>


    <!-- ============================================================
         FOOTER
    ============================================================ -->

    <div class="footer">
        © 2026 Parcel Tracking. All rights reserved.
    </div>

</div>


<!-- ================================================================
     SHOW / HIDE PASSWORD
================================================================ -->

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.getElementById("showPassword");

    if (password.type === "password") {

        password.type = "text";

        button.textContent = "Hide";

    } else {

        password.type = "password";

        button.textContent = "Show";

    }

}

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
